name: Integração contínua

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Executar testes Maven
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Build do frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Gerar build de produção
        run: npm run build

  containers:
    name: Validação integrada em containers
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Criar variáveis temporárias de CI
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_DB=sgv
          POSTGRES_USER=sgv_admin
          POSTGRES_PASSWORD=ci_admin_password
          POSTGRES_APP_USER=sgv_app
          POSTGRES_APP_PASSWORD=ci_application_password
          CORS_ORIGIN=http://localhost:5173
          EOF
      - name: Validar configuração do Compose
        run: docker compose --env-file .env.ci config --quiet
      - name: Construir e iniciar os serviços
        run: docker compose --env-file .env.ci up --detach --build
      - name: Aguardar disponibilidade da API
        run: |
          set -euo pipefail
          for tentativa in $(seq 1 36); do
            if curl --fail --silent --show-error http://localhost:8080/api/employees >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "A API não respondeu dentro do tempo esperado." >&2
          exit 1
      - name: Validar fluxo integrado de empregado e viagem
        run: |
          set -euo pipefail
          empregado=$(curl --fail --silent --show-error \
            --request POST http://localhost:8080/api/employees \
            --header 'Content-Type: application/json' \
            --data '{"registrationNumber":"CI-0001","name":"Empregado de CI","area":"Qualidade"}')
          empregado_id=$(printf '%s' "$empregado" | jq --raw-output '.id')
          test -n "$empregado_id"
          test "$empregado_id" != "null"

          viagem=$(curl --fail --silent --show-error \
            --request POST http://localhost:8080/api/trips \
            --header 'Content-Type: application/json' \
            --data "{\"destination\":\"Curitiba\",\"departureDate\":\"2026-09-10\",\"returnDate\":\"2026-09-12\",\"reason\":\"Validação integrada\",\"transportMode\":\"Ônibus\",\"employeeId\":\"$empregado_id\"}")
          test "$(printf '%s' "$viagem" | jq --raw-output '.status')" = "RASCUNHO"
          test "$(printf '%s' "$viagem" | jq --raw-output '.tripNumber')" != "null"

          curl --fail --silent --show-error http://localhost:5173/ >/dev/null
      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose --env-file .env.ci logs --no-color
      - name: Encerrar ambiente de CI
        if: always()
        run: docker compose --env-file .env.ci down --volumes --remove-orphans
