name: Integracao continua

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testar backend
        run: mvn --batch-mode --file backend/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend
      - name: Compilar frontend
        run: npm run build
        working-directory: frontend
