spring:
  application:
    name: sgv-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sgv}
    username: ${SPRING_DATASOURCE_USERNAME:sgv}
    password: ${SPRING_DATASOURCE_PASSWORD:sgv}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
